version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nu_ai_platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PRIMARY_MODEL=${PRIMARY_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/nu_tokens.db}
      - JWT_SECRET=${JWT_SECRET:-nu_ai_secret_key_change_in_production_2026}
      - MCP_AUTH_SECRET=${MCP_AUTH_SECRET:-mcp_secret_nu_2026}
      - CRAWL_INTERVAL_HOURS=4
      - RATE_LIMIT_PER_MINUTE=60
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./nu_vector_db:/app/nu_vector_db
      - ./skills:/app/skills
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
